[project]
name = "eval-harness-fixture-tasks"
version = "0.1.0"
description = "A deterministic eval harness for fixture tasks with pass@k, latency, and cost aggregation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Monteiro" }]
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "main.py"]
warn_unreachable = true
